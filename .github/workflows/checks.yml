name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python selfcheck.py
      - run: python checkcode.py
      - run: python -m pytest -q tests
  linux:
    # The web app as it runs on a server, including the headless-browser
    # submission tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python selfcheck.py
      - run: python checkcode.py
      - run: python -m pytest -q tests
        env:
          CI_HAS_PLAYWRIGHT: "1"
